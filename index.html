<!DOCTYPE html>
<!--
DESIGN CONCEPT: "The Interactive Shell"
Your whole portfolio is a live terminal session. The hero is a working prompt: visitors type
(or tap) commands like `about`, `skills`, `projects`, `contact` and the page scrolls to / reveals
each section styled as command output. Skills render as a process monitor, projects as a git log,
experience as a changelog. Signature element: the interactive prompt in the hero.

NOTE: No resume was supplied, so all content below is clearly marked placeholder text in the
DATA object at the top of the script. Replace the [BRACKETED] values with your real details.
Nothing here is real information about you.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satyam Sharma — Cybersecurity Portfolio</title>
<meta name="description" content="Portfolio of Satyam Sharma">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f14;--panel:#111821;--line:#223041;--text:#d7e2ee;--dim:#8da2b8;
  --accent:#5eead4;--accent2:#fbbf24;--err:#fb7185;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --head:'Space Grotesk',system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f7fa;--panel:#fff;--line:#cfd9e4;--text:#14202c;--dim:#46596d;--accent:#0b7a6b;--accent2:#9a5b00;--err:#b4233a}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.65;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-attachment:fixed;background-blend-mode:soft-light}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#000;padding:8px 12px;z-index:100}
.skip:focus{left:8px}
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.bar nav{max-width:1000px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.bar a{flex:none;text-decoration:none;color:var(--dim);padding:6px 12px;border:1px solid var(--line);border-bottom:none;
  border-radius:6px 6px 0 0;font-size:13px;background:var(--panel)}
.bar a:hover,.bar a.on{color:var(--accent);border-color:var(--accent)}
main{max-width:1000px;margin:auto;padding:0 16px 80px}
section{margin-top:72px}
h1,h2{font-family:var(--head);margin:0}
h2{font-size:clamp(1.4rem,3vw,1.9rem);margin-bottom:20px}
h2::before{content:"$ ";color:var(--accent)}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.win-top{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot:nth-child(1){background:var(--err)}.dot:nth-child(2){background:var(--accent2)}.dot:nth-child(3){background:var(--accent)}
.win-top span{margin-left:8px}
.win-body{padding:20px}
/* hero */
.hero{margin-top:32px}
.hero h1{font-size:clamp(2.2rem,8vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--accent)}
.tag{color:var(--dim);margin:12px 0 0;max-width:60ch}
#term{height:300px;overflow-y:auto;font-size:14px;margin-top:20px;padding:4px 2px;scrollbar-width:thin}
#term p{margin:0 0 4px;white-space:pre-wrap;word-break:break-word}
.p{color:var(--accent)}.d{color:var(--dim)}.w{color:var(--accent2)}.e{color:var(--err)}
.prompt{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:12px 20px}
.prompt label{color:var(--accent);white-space:nowrap}
.prompt input{flex:1;min-width:0;background:transparent;border:0;color:var(--text);font:inherit;caret-color:var(--accent);outline-offset:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{font:inherit;font-size:13px;background:transparent;color:var(--accent);border:1px solid var(--accent);
  border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.chips button:hover{background:var(--accent);color:var(--bg)}
/* skills monitor */
.mon{display:grid;gap:12px}
.row{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:12px;align-items:center}
.track{height:12px;background:var(--bg);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 10px);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row b{font-weight:600;font-size:13px}.row small{color:var(--dim);text-align:right}
/* log */
.log{display:grid;gap:14px}
.commit{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:6px;padding:16px 18px;
  transition:transform .25s,border-color .25s}
.commit:hover{transform:translateX(6px);border-left-color:var(--accent)}
.hash{color:var(--accent2);font-size:12px}
.commit h3{font-family:var(--head);margin:4px 0 6px;font-size:1.15rem}
.commit p{margin:0;color:var(--dim)}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stack span{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--text)}
.commit a{display:inline-block;margin-top:10px;font-size:13px}
/* changelog */
.chg{border-left:1px dashed var(--line);margin-left:6px;padding-left:20px;display:grid;gap:22px}
.chg article{position:relative}
.chg article::before{content:"";position:absolute;left:-26px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--bg)}
.chg h3{margin:0;font-family:var(--head);font-size:1.1rem}
.chg time{color:var(--dim);font-size:13px}
.chg ul{margin:8px 0 0;padding-left:18px;color:var(--text)}
/* contact */
form{display:grid;gap:12px;margin-top:16px}
form input,form textarea{width:100%;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px}
form textarea{min-height:120px;resize:vertical}
.btn{font:inherit;font-weight:600;background:var(--accent);color:var(--bg);border:0;border-radius:6px;padding:12px 18px;cursor:pointer;min-height:44px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
.links a{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:6px;text-decoration:none}
.links a:hover{border-color:var(--accent)}
footer{text-align:center;color:var(--dim);font-size:13px;padding:32px 16px}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--accent);vertical-align:-.2em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:560px){
  .row{grid-template-columns:1fr 48px;grid-template-areas:"n p" "t t"}
  .row b{grid-area:n}.row small{grid-area:p}.row .track{grid-area:t}
  #term{height:260px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <nav aria-label="Sections">
    <a href="#home" class="on">~/home</a>
    <a href="#about">about.md</a>
    <a href="#skills">skills.sh</a>
    <a href="#projects">git-log</a>
    <a href="#experience">changelog</a>
    <a href="#contact">contact.sh</a>
  </nav>
</header>

<main id="main">
  <section id="home" class="hero" style="margin-top:32px">
    <h1 id="hName">Satyam Sharma</h1>
    <p class="tag" id="hTag">Cybersecurity Enthusiast — Learning to find weaknesses before attackers do.</p>
    <div class="win" style="margin-top:24px">
      <div class="win-top" aria-hidden="true"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>guest@portfolio: ~</span></div>
      <div class="win-body">
        <div id="term" role="log" aria-live="polite" tabindex="0" aria-label="Terminal output"></div>
      </div>
      <form class="prompt" id="cmdForm" style="margin:0;display:flex">
        <label for="cmd">guest@portfolio:~$</label>
        <input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type 'help'">
      </form>
    </div>
    <div class="chips" id="chips" aria-label="Quick commands"></div>
  </section>

  <section id="about" class="reveal">
    <h2>cat about.md</h2>
    <div class="win"><div class="win-body" id="aboutBody"></div></div>
  </section>

  <section id="skills" class="reveal">
    <h2>top --skills</h2>
    <div class="win"><div class="win-body"><div class="mon" id="mon"></div></div></div>
  </section>

  <section id="projects" class="reveal">
    <h2>git log --projects</h2>
    <div class="log" id="log"></div>
  </section>

  <section id="experience" class="reveal">
    <h2>cat CHANGELOG</h2>
    <div class="chg" id="chg"></div>
  </section>

  <section id="contact" class="reveal">
    <h2>./contact.sh</h2>
    <div class="win"><div class="win-body">
      <p id="cLine" style="margin-top:0"></p>
      <ul class="links" id="links"></ul>
      <form id="mailForm">
        <label for="fn" class="d">name</label>
        <input id="fn" required autocomplete="name">
        <label for="fm" class="d">message</label>
        <textarea id="fm" required></textarea>
        <button class="btn" type="submit">send --via-email</button>
      </form>
    </div></div>
  </section>
</main>
<footer id="foot"></footer>

<script>
/* ============================================================
   EDIT ME — replace every [BRACKETED] value with your real info.
   Skill "level" is 0–100 (your own honest self-rating).
   Remove any item you don't need; add more by copying a block.
   ============================================================ */
const DATA = {
  name: "Satyam Sharma",
  role: "Cybersecurity Enthusiast",
  tagline: "Learning to find weaknesses before attackers do.",
  email: "your.email@example.com",
  about: [
    "I am Satyam Sharma, focused on cybersecurity: understanding how systems break so they can be defended better.",
    "My work centres on network security, web application security and security automation."
  ],
  skills: [
    { name: "Network Security", level: 80 },
    { name: "Web App Security", level: 75 },
    { name: "Linux & Bash", level: 80 },
    { name: "Python Scripting", level: 70 },
    { name: "Threat Analysis", level: 65 }
  ],
  /* SAMPLE PROJECTS — replace with your real projects, descriptions and links */
  projects: [
    { title: "Network Port Scanner", desc: "Python tool that scans hosts in a lab network for open ports and flags risky exposed services.", stack: ["Python", "Sockets", "Nmap"], url: "" },
    { title: "Phishing URL Detector", desc: "Classifier that inspects URL patterns and domain features to flag likely phishing links.", stack: ["Python", "scikit-learn"], url: "" },
    { title: "Log Analyzer & Alert System", desc: "Parses server logs to detect brute-force login attempts and raises alerts on suspicious activity.", stack: ["Python", "Regex", "Linux"], url: "" },
    { title: "Password Strength & Breach Checker", desc: "Evaluates password strength and checks credentials against known-breach patterns locally.", stack: ["JavaScript", "Python"], url: "" },
    { title: "Vulnerable Web Lab Writeups", desc: "Documented walkthroughs of SQL injection and XSS found and fixed in intentionally vulnerable apps.", stack: ["DVWA", "Burp Suite", "OWASP Top 10"], url: "" }
  ],
  experience: [],
  links: [
    { label: "GitHub", url: "" },
    { label: "LinkedIn", url: "" }
  ]
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, props = {}, kids = []) => {
  const n = document.createElement(t);
  Object.entries(props).forEach(([k, v]) => k === "text" ? n.textContent = v : n.setAttribute(k, v));
  kids.forEach(k => n.append(k));
  return n;
};
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "";
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

/* ---------- render static sections ---------- */
document.title = DATA.name + " — Cybersecurity Portfolio";
$("#hName").textContent = DATA.name;
$("#hTag").textContent = DATA.role + " — " + DATA.tagline;
DATA.about.forEach(t => $("#aboutBody").append(el("p", { text: t, style: "margin:0 0 10px" })));

DATA.skills.forEach(s => {
  const lvl = Math.max(0, Math.min(100, +s.level || 0));
  const fill = el("div", { class: "fill", "data-w": lvl });
  const track = el("div", { class: "track", role: "img", "aria-label": s.name + " " + lvl + " percent" }, [fill]);
  $("#mon").append(el("div", { class: "row" }, [el("b", { text: s.name }), track, el("small", { text: lvl + "%" })]));
});

DATA.projects.forEach((p, i) => {
  const c = el("article", { class: "commit" }, [
    el("div", { class: "hash", text: "commit " + (0xa1b2c3 + i * 4919).toString(16) }),
    el("h3", { text: p.title }),
    el("p", { text: p.desc }),
    el("div", { class: "stack" }, (p.stack || []).map(t => el("span", { text: t })))
  ]);
  if (safeUrl(p.url)) c.append(el("a", { href: p.url, target: "_blank", rel: "noopener", text: "view project →" }));
  $("#log").append(c);
});

if (!DATA.experience.length) {
  document.getElementById("experience").remove();
  document.querySelector('.bar a[href="#experience"]').remove();
}
DATA.experience.forEach(x => {
  $("#chg").append(el("article", {}, [
    el("h3", { text: x.role + " · " + x.org }),
    el("time", { text: x.when }),
    el("ul", {}, (x.points || []).map(t => el("li", { text: t })))
  ]));
});

$("#cLine").textContent = "Open to conversations. Write to " + DATA.email + " or use a link below.";
$("#links").append(el("li", {}, [el("a", { href: "mailto:" + DATA.email, text: "Email" })]));
DATA.links.filter(l => safeUrl(l.url)).forEach(l =>
  $("#links").append(el("li", {}, [el("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label })])));
$("#foot").textContent = "© " + new Date().getFullYear() + " " + DATA.name + " — built as a shell session.";

$("#mailForm").addEventListener("submit", e => {
  e.preventDefault();
  const sub = encodeURIComponent("Portfolio message from " + $("#fn").value);
  const body = encodeURIComponent($("#fm").value);
  location.href = "mailto:" + DATA.email + "?subject=" + sub + "&body=" + body;
});

/* ---------- terminal ---------- */
const term = $("#term"), input = $("#cmd");
const history = []; let hi = 0;
function out(text, cls = "") {
  const p = el("p", { text });
  if (cls) p.className = cls;
  term.append(p); term.scrollTop = term.scrollHeight;
}
const go = id => { const t = document.getElementById(id); if (t) t.scrollIntoView({ behavior: reduce ? "auto" : "smooth" }); };
const commands = {
  help: () => out("commands: about  skills  projects  contact  whoami  clear", "w"),
  whoami: () => out(DATA.name + " — " + DATA.role),
  about: () => { DATA.about.forEach(t => out(t)); go("about"); },
  skills: () => { DATA.skills.forEach(s => out(s.name.padEnd(18, ".") + s.level + "%")); go("skills"); },
  projects: () => { DATA.projects.forEach(p => out("▸ " + p.title)); go("projects"); },
  experience: () => { if (!DATA.experience.length) return out("no experience entries yet", "d"); DATA.experience.forEach(x => out("▸ " + x.role + " @ " + x.org + " (" + x.when + ")")); go("experience"); },
  contact: () => { out("email: " + DATA.email, "p"); go("contact"); },
  clear: () => { term.textContent = ""; }
};
function run(raw) {
  const c = raw.trim().toLowerCase();
  if (!c) return;
  out("guest@portfolio:~$ " + raw, "d");
  history.push(raw); hi = history.length;
  (commands[c] || (() => out("command not found: " + c + " — try 'help'", "e")))();
}
$("#cmdForm").addEventListener("submit", e => { e.preventDefault(); run(input.value); input.value = ""; });
input.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && history.length) { hi = Math.max(0, hi - 1); input.value = history[hi]; e.preventDefault(); }
  if (e.key === "ArrowDown") { hi = Math.min(history.length, hi + 1); input.value = history[hi] || ""; e.preventDefault(); }
});
["about", "skills", "projects", "experience", "contact"].filter(c => c !== "experience" || DATA.experience.length).forEach(c =>
  $("#chips").append(el("button", { type: "button", text: "> " + c }))
);
$("#chips").addEventListener("click", e => {
  if (e.target.tagName === "BUTTON") run(e.target.textContent.replace("> ", ""));
});

/* boot sequence */
const boot = ["Booting portfolio v1.0 ...", "Loading profile: " + DATA.name, "Type 'help' or tap a command below."];
(function bootSeq(i = 0) {
  if (i >= boot.length) return;
  out(boot[i], i === 0 ? "d" : "p");
  reduce ? bootSeq(i + 1) : setTimeout(() => bootSeq(i + 1), 450);
})();

/* ---------- scroll reveal, skill bars, nav highlight ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add("in");
  e.target.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%");
  io.unobserve(e.target);
}), { threshold: .15 });
document.querySelectorAll(".reveal").forEach(s => io.observe(s));

const links = [...document.querySelectorAll(".bar a")];
const so = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section").forEach(s => so.observe(s));
</script>
<noscript><p style="padding:16px">This portfolio needs JavaScript to display its content.</p></noscript>
</body>
</html>
